[project]
name = "anki-writer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "transformers>=4.46",
    "torch>=2.4",
    "accelerate>=0.34",
    "outlines>=0.1",
    "pydantic>=2",
    "pydantic-settings>=2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anki_writer = ["prompts/*.txt"]
